<!DOCTYPE html>
<html>
<head>
    <title>Daily Check-In</title>
</head>
<body>
    <h1>Daily Check-In</h1>

    <form method="POST">
        <label>Mood (1-10):</label>
        <input type="number" name="mood" min="1" max="10"><br>

        <label>Anxiety (1-10):</label>
        <input type="number" name="anxiety" min="1" max="10"><br>

        <label>Energy (1-10):</label>
        <input type="number" name="energy" min="1" max="10"><br>

        <label>Sleep (1-10):</label>
        <input type="number" name="sleep" min="1" max="10"><br>

        <label>Stress (1-10):</label>
        <input type="number" name="stress" min="1" max="10"><br>

        <label>Notes:</label>
        <textarea name="notes"></textarea><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
